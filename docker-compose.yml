services:
  database:
    container_name: db_postgres
    image: postgres:latest
    restart: always 
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      -  "${POSTGRES_PORT}:5432"

  api:
    container_name: fastapi_app
    build: .
    ports:
      -  "${API_PORT}:8000"
    depends_on:
      - database

volumes:
  pgdata: